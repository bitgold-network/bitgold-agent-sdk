[project]
name = "bitgold-agent"
dynamic = ["version"]
description = "Modular Python SDK for on-chain AI agents on Bitgold Network"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Bitgold Network", email = "dev@bitgold.network"},
]
keywords = [
    "erc-8004",
    "erc-8183",
    "blockchain",
    "ethereum",
    "agent",
    "web3",
    "bitgold",
    "btg",
    "sdk",
    "modular",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet",
]
dependencies = [
    "web3>=6.15.0,<8",
    "eth-account>=0.10.0,<0.14",
    "python-dotenv>=1.0.0,<2",
    "requests>=2.31.0,<3",
]

[project.urls]
Homepage = "https://github.com/bitgold-network/bitgold-agent-sdk"
Documentation = "https://github.com/bitgold-network/bitgold-agent-sdk#readme"
Repository = "https://github.com/bitgold-network/bitgold-agent-sdk"
Issues = "https://github.com/bitgold-network/bitgold-agent-sdk/issues"

[project.optional-dependencies]
ipfs = [
    "httpx>=0.25.0,<1",
]
turnkey = [
    "cryptography>=42.0.0,<51",
]
dev = [
    "pytest>=7.4.0",
    "pytest-mock>=3.11.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.25.0",
    "ruff>=0.4.0",
    # Exercises the turnkey extra's stamper in CI.
    "cryptography>=42.0.0",
]
examples = [
    "aiosqlite>=0.19",
    "ddgs>=6.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "bitgold_agent/_version.py"

[tool.hatch.build.targets.sdist]
exclude = [
    ".claude/",
    ".github/",
    ".venv/",
    "_docs/",
    "dist/",
]

[tool.hatch.build.targets.wheel]
packages = ["bitgold_agent"]

# Contract ABIs are language-neutral and shared with the TypeScript SDK, so they
# live at the repo root (../abis) as the single source of truth. The custom build
# hook below copies them into the package (bitgold_agent/abis/) at build time so
# `pip install` ships them; `artifacts` forces their inclusion even though the
# copied dir is git-ignored. The runtime loader (bitgold_agent/core/abis.py) prefers
# ../abis in a source checkout and uses the in-package copy when installed.
[tool.hatch.build]
artifacts = ["bitgold_agent/abis/*.json"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.ruff]
target-version = "py310"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["bitgold_agent"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
